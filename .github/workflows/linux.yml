name: Linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Ubuntu mirror DNS
        run: |
          if ! timeout 15 getent ahostsv4 azure.archive.ubuntu.com; then
            interface=$(ip -o route show default | awk '{print $5; exit}')
            sudo resolvectl dns "$interface" 1.1.1.1 8.8.8.8
            sudo resolvectl domain "$interface" '~.'
            sudo resolvectl flush-caches
            timeout 30 getent ahostsv4 azure.archive.ubuntu.com
          fi
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev zsh
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: node scripts/PiStatusSmoke.mjs
      - run: node scripts/PiCollaborationSmoke.mjs
      - run: node scripts/OpenCodeSessionSmoke.mjs
      - run: npm --prefix frontend run build
      - run: go vet -tags webkit2_41 ./...
      - run: go test -race -tags webkit2_41 ./...
      - name: Build the app
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          make build
