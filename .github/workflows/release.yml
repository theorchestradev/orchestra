# Pushing a SemVer tag such as v0.2.0 (or v0.2.0-beta.1 for a pre-release) builds
# both platforms and publishes a GitHub Release.
#
# Signing and notarization use these repository secrets:
#   MACOS_CERTIFICATE           Developer ID Application certificate and key (.p12, base64)
#   MACOS_CERTIFICATE_PASSWORD  The .p12 password
#   APPLE_API_KEY               App Store Connect API key (AuthKey_….p8, base64), Developer role
#   APPLE_API_KEY_ID            The key ID
#   APPLE_API_ISSUER            The issuer ID
# Stable signed releases also update the cask in theorchestradev/homebrew-tap, using:
#   HOMEBREW_TAP_TOKEN          Fine-grained token with Contents read and write access to that repository
# Set them with `base64 -i file | gh secret set NAME`. Analytics read the
# POSTHOG_PROJECT_TOKEN secret and POSTHOG_HOST variable (see docs/privacy.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    # Without the signing secrets the app is signed ad hoc and not notarized.
    env:
      SIGNED: ${{ secrets.MACOS_CERTIFICATE != '' }}
    outputs:
      signed: ${{ env.SIGNED }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "$GITHUB_REF_NAME is not a SemVer tag such as v0.2.0." >&2; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Import the signing certificate
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Build
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          make build VERSION="$VERSION" PLATFORM=darwin/universal BUILD_BRANCH= RELEASE_TELEMETRY=1
      - name: Sign, notarize and package
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGNED" = true ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY" | base64 --decode > "$APPLE_API_KEY_PATH"
          else
            echo "::warning::The signing secrets are missing, so the macOS app is not signed or notarized."
            export UNSIGNED=1
          fi
          scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Orchestra-*
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          make build VERSION="$VERSION" BUILD_BRANCH= RELEASE_TELEMETRY=1
      - name: Package
        run: |
          name="Orchestra-$VERSION-linux-x86_64"
          mkdir -p "dist/$name"
          cp build/bin/orchestra LICENSE "dist/$name/"
          cp build/appicon.png "dist/$name/orchestra.png"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Orchestra-*.tar.gz
          if-no-files-found: error

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          cd dist
          # The in-app updater downloads assets by name and verifies SHA256SUMS, and the website
          # links to releases/latest/download/Orchestra-macos-universal.dmg. Keep both stable.
          cp Orchestra-*-macos-universal.dmg Orchestra-macos-universal.dmg
          sha256sum Orchestra-* > SHA256SUMS
          cat SHA256SUMS
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' ../CHANGELOG.md > "$notes_file"
          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "Missing changelog notes for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$SIGNED" != true ]; then
            prerelease=--prerelease
            printf '\n%s\n' 'The macOS app in this release is not signed or notarized. After copying it to Applications, run `xattr -dr com.apple.quarantine /Applications/Orchestra.app` before opening it.' >> "$notes_file"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$notes_file" --title "Orchestra ${GITHUB_REF_NAME#v}" $prerelease Orchestra-* SHA256SUMS

  # Stable releases with a signed and notarized macOS app update the Homebrew cask.
  homebrew:
    needs: [macos, release]
    if: needs.macos.outputs.signed == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check the tap token
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is missing, so the Homebrew cask was not updated."
          fi
      - uses: actions/checkout@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: theorchestradev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update the cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256=$(gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O - |
            awk -v name="Orchestra-$version-macos-universal.dmg" '$2 == name { print $1 }')
          echo "$sha256" | grep -Eq '^[0-9a-f]{64}$' || { echo "No SHA-256 for the $version DMG in SHA256SUMS." >&2; exit 1; }
          sed -i -E \
            -e "s/^  version \"[^\"]*\"/  version \"$version\"/" \
            -e "s/^  sha256 \"[^\"]*\"/  sha256 \"$sha256\"/" \
            Casks/orchestra.rb
          git diff --exit-code --quiet && { echo "The cask is already at $version."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Orchestra to $version"
          git push
